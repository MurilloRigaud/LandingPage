<section class="hero">
  <div class="carrossel">

    @for (slide of slides; track slide.image; let i = $index) {

      <div
        class="slide"
        [class.active]="i === currentSlide()"
        [style.--bg]="'url(' + assetUrl(slide.mobileImage) + ')'"
      >

        <picture>

          <source
            media="(max-width: 768px)"
            [srcset]="assetUrl(slide.mobileImage)"
          />

          <img
            [src]="assetUrl(slide.image)"
            [alt]="slide.alt"
          />

        </picture>

      </div>

    }

    <button
      class="carrossel-btn prev"
      (click)="previousSlide()"
      aria-label="Imagem anterior"
    >
      &#10094;
    </button>

    <button
      class="carrossel-btn next"
      (click)="nextSlide()"
      aria-label="Próxima imagem"
    >
      &#10095;
    </button>

    <div class="indicators">

      @for (slide of slides; track slide.image; let i = $index) {

        <button
          [class.active]="i === currentSlide()"
          (click)="goToSlide(i)"
          [attr.aria-label]="'Ir para o slide ' + (i + 1)"
        ></button>

      }

    </div>

  </div>
</section>
