<div class="galeria">
  <h1>Galeria</h1>
  <p>Nossa galeria de fotos mostrando os serviços.</p>
  <div class="carrossel">
    <button class="seta seta-esquerda" (click)="fotoAnterior()" aria-label="Foto anterior">
      &#10094;
    </button>

    <div class="carrossel-slide">
      <img [src]="fotos[indiceAtual].src" [alt]="fotos[indiceAtual].legenda" />
      <p class="legenda">{{ fotos[indiceAtual].legenda }}</p>
    </div>

    <button class="seta seta-direita" (click)="proximaFoto()" aria-label="Próxima foto">
      &#10095;
    </button>
  </div>

  <div class="pontos">
    <span
      class="ponto"
      *ngFor="let foto of fotos; let i = index"
      [class.ativo]="i === indiceAtual"
      (click)="irParaFoto(i)"
    ></span>
  </div>
</div>
